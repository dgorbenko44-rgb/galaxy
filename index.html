<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy — Interactive</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; }
  body {
    background:#02060b;
    color:#fff;
    font-family:Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    user-select:none;
  }
  .space {
    position:relative;
    width:100vw;
    height:100vh;
    perspective:1100px;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 50%, rgba(35,50,65,.18), transparent 45%),
      #02060b;
  }
  .scene {
    position:absolute;
    left:50%;
    top:50%;
    width:min(78vw, 760px);
    aspect-ratio:1/1;
    transform-style:preserve-3d;
    transform:translate(-50%,-50%) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1);
    cursor:grab;
    will-change:transform;
  }
  .scene.dragging { cursor:grabbing; }
  .scene img {
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    border-radius:50%;
    filter:drop-shadow(0 0 35px rgba(160,200,255,.08));
    pointer-events:none;
  }
  .hint {
    position:absolute;
    left:50%;
    bottom:28px;
    transform:translateX(-50%);
    padding:10px 16px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:999px;
    background:rgba(5,10,16,.62);
    backdrop-filter:blur(12px);
    color:rgba(255,255,255,.75);
    font-size:14px;
    letter-spacing:.2px;
  }
  .controls {
    position:absolute;
    top:20px;
    left:20px;
    padding:12px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
    background:rgba(5,10,16,.55);
    backdrop-filter:blur(14px);
  }
  button {
    border:0;
    border-radius:9px;
    padding:8px 11px;
    margin-right:6px;
    color:white;
    background:rgba(255,255,255,.10);
    cursor:pointer;
  }
  button:hover { background:rgba(255,255,255,.18); }
  .title {
    position:absolute;
    top:22px;
    right:24px;
    color:rgba(255,255,255,.55);
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
  }
</style>
</head>
<body>
<div class="space" id="space">
  <div class="title">GALAXY</div>
  <div class="controls">
    <button id="reset">Сбросить</button>
    <button id="spin">Авто-вращение</button>
  </div>

<script>
const scene = document.getElementById('scene');
let rx = 0, ry = 0, rz = 0, scale = 1;
let dragging = false, lastX = 0, lastY = 0, auto = false;

function render() {
  scene.style.transform =
    `translate(-50%,-50%) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${scale})`;
}

scene.addEventListener('pointerdown', e => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  scene.classList.add('dragging');
  scene.setPointerCapture(e.pointerId);
});

scene.addEventListener('pointermove', e => {
  if (!dragging) return;
  ry += (e.clientX - lastX) * 0.35;
  rx -= (e.clientY - lastY) * 0.35;
  lastX = e.clientX;
  lastY = e.clientY;
  render();
});

scene.addEventListener('pointerup', () => {
  dragging = false;
  scene.classList.remove('dragging');
});
scene.addEventListener('pointercancel', () => {
  dragging = false;
  scene.classList.remove('dragging');
});

scene.addEventListener('wheel', e => {
  e.preventDefault();
  scale = Math.max(.55, Math.min(2.4, scale - e.deltaY * 0.001));
  render();
}, {passive:false});

document.getElementById('reset').onclick = () => {
  rx = ry = rz = 0;
  scale = 1;
  render();
};

document.getElementById('spin').onclick = () => {
  auto = !auto;
  document.getElementById('spin').textContent = auto ? 'Остановить' : 'Авто-вращение';
};

function loop() {
  if (auto && !dragging) {
    ry += 0.18;
    render();
  }
  requestAnimationFrame(loop);
}
render();
loop();
</script>
